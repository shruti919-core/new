<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Exploration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="universe">
        <div class="stars"></div>
        <div class="twinkle"></div>
        <div class="nebula"></div>

        <section class="hero">
            <h1 class="glitch-text">VOYAGER</h1>
            <p>Exploring the Final Frontier</p>
            <button class="explore-btn">LAUNCH MISSION</button>
        </section>

        <div class="solar-system">
            <div class="sun"></div>
            <div class="orbit earth-orbit">
                <div class="earth">
                    <div class="moon"></div>
                </div>
            </div>
            <div class="orbit mars-orbit">
                <div class="mars"></div>
            </div>
        </div>

        <div class="astronaut">👨‍🚀</div>
    </div>
</body>
</html>
